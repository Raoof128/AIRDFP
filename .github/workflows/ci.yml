name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check code formatting with Black
        run: black --check phase_*/ tests/ --line-length 100

      - name: Lint with flake8
        run: |
          flake8 phase_*/ tests/ --count --show-source --statistics

      - name: Lint with pylint
        run: |
          pylint phase_*/ tests/ --exit-zero

      - name: Type checking with mypy
        run: |
          mypy phase_*/ tests/ --ignore-missing-imports
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.8', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python3 tests/test_core_functionality.py

      - name: Run system validation
        run: |
          python3 tests/validate_system.py

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: |
          docker-compose config

      - name: Build Docker services (test only)
        run: |
          docker-compose build --no-cache
        continue-on-error: true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Docker services
        run: |
          docker-compose up -d
          sleep 60  # Wait for services to be ready

      - name: Check service health
        run: |
          # Check Elasticsearch
          curl -f http://localhost:9200/_cluster/health || exit 1

          # Check TheHive
          curl -f http://localhost:9000 || exit 1

      - name: Stop Docker services
        run: |
          docker-compose down -v

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation structure
        run: |
          # Check required documentation files
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f CHANGELOG.md || (echo "Missing CHANGELOG.md" && exit 1)
          test -f CONTRIBUTING.md || (echo "Missing CONTRIBUTING.md" && exit 1)
          test -f SECURITY.md || (echo "Missing SECURITY.md" && exit 1)
          test -f docs/ARCHITECTURE.md || (echo "Missing ARCHITECTURE.md" && exit 1)
          test -f docs/DEPLOYMENT.md || (echo "Missing DEPLOYMENT.md" && exit 1)
          test -f docs/API_DOCUMENTATION.md || (echo "Missing API_DOCUMENTATION.md" && exit 1)
          test -f docs/FAQ.md || (echo "Missing FAQ.md" && exit 1)

      - name: Validate YAML files
        run: |
          # Check all YAML files are valid
          find . -name "*.yml" -o -name "*.yaml" | while read file; do
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

      - name: Check markdown links (if mdl is available)
        run: |
          if command -v mdl &> /dev/null; then
            mdl README.md CONTRIBUTING.md docs/*.md
          else
            echo "⚠️ markdownlint not installed, skipping"
          fi
        continue-on-error: true
